<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>导航站</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#f4f7fc;
    color:#17213a;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif
}
.wrap{
    max-width:720px;
    margin:auto;
    padding:12px 10px 85px
}
.banner{
    position:relative;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 4px 18px #0001;
    margin-bottom:14px;
    display:none
}
.banner-viewport{
    position:relative;
    width:100%;
    overflow:hidden;
    touch-action:pan-y
}
.banner-track{
    display:flex;
    width:100%;
    will-change:transform;
    transition:transform .45s ease
}
.banner-slide{
    flex:0 0 100%;
    width:100%;
    display:block
}
.banner-slide a{
    display:block;
    width:100%;
}
.banner-slide img{
    display:block;
    width:100%;
    height:250px;
    object-fit:cover;
    background:#f7f8fb
}
.banner-dots{
    position:absolute;
    left:0;
    right:0;
    bottom:10px;
    display:flex;
    justify-content:center;
    gap:6px;
    z-index:3
}
.banner-dot{
    width:7px;
    height:7px;
    border:0;
    border-radius:50%;
    padding:0;
    background:rgba(255,255,255,.55);
    box-shadow:0 1px 4px #0003;
    cursor:pointer
}
.banner-dot.active{
    width:18px;
    border-radius:99px;
    background:#fff
}
.banner-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:3;
    width:34px;
    height:44px;
    padding:0;
    border:0;
    border-radius:10px;
    background:#0004;
    color:#fff;
    font-size:24px;
    line-height:44px;
    cursor:pointer
}
.banner-prev{left:8px}
.banner-next{right:8px}
.banner.single .banner-arrow,
.banner.single .banner-dots{display:none}
.section{
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 4px 18px #0001;
    margin-bottom:14px;
    padding:16px
}
.title{
    font-size:22px;
    font-weight:800;
    margin-bottom:14px
}
.grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:9px
}
.card{
    position:relative;
    min-width:0;
    background:#f0f5ff;
    border-radius:14px;
    padding:10px 6px;
    text-align:center
}
.logo{
    width:48px;
    height:48px;
    border-radius:50%;
    object-fit:cover;
    background:white
}
.name{
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}
.desc{
    font-size:11px;
    color:#71809b;
    height:32px;
    line-height:16px;
    margin:5px 0
}
.go{
    display:inline-block;
    padding:7px 12px;
    border-radius:99px;
    background:#287ff0;
    color:#fff;
    text-decoration:none;
    font-size:12px
}
.tag{
    position:absolute;
    right:4px;
    top:4px;
    background:#20b95b;
    color:white;
    border-radius:4px;
    padding:2px 5px;
    font-size:9px
}
.empty{
    text-align:center;
    color:#8b95a8;
    padding:30px
}
.nav{
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    width:min(680px,calc(100% - 20px));
    height:60px;
    background:#ffffffeF;
    border:1px solid #e5eaf2;
    border-radius:20px;
    display:flex;
    justify-content:space-around;
    align-items:center;
    box-shadow:0 6px 28px #0002
}
.nav a{
    text-decoration:none;
    color:#68758c;
    font-size:12px;
    text-align:center
}
.nav .active{
    color:#1976ee;
    font-weight:700
}
.ico{
    display:block;
    font-size:21px
}
@media(max-width:430px){
    .grid{gap:7px}
    .card{padding-left:4px;padding-right:4px}
    .go{padding:7px 9px}
    .banner-slide img{height:210px}
    .banner-arrow{display:none}
}
@media(prefers-reduced-motion:reduce){
    .banner-track{transition:none}
}
</style>
</head>
<body>
<main class="wrap">
    <div id="banner" class="banner">
        <div id="bannerViewport" class="banner-viewport">
            <div id="bannerTrack" class="banner-track"></div>
        </div>
        <button id="bannerPrev" class="banner-arrow banner-prev" aria-label="上一张">‹</button>
        <button id="bannerNext" class="banner-arrow banner-next" aria-label="下一张">›</button>
        <div id="bannerDots" class="banner-dots"></div>
    </div>

    <section class="section">
        <div class="title" id="title">推荐导航</div>
        <div id="grid" class="grid">
            <div class="empty">加载中…</div>
        </div>
    </section>
</main>

<nav class="nav">
    <a class="active" href="/"><span class="ico">⌂</span>首页</a>
    <a id="simulator" href="#"><span class="ico">🎮</span>PG模拟器</a>
    <a href="/pg-tips.html"><span class="ico">📖</span>PG技巧</a>
    <a href="/admin.html"><span class="ico">⚙</span>管理</a>
</nav>

<script>
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[m]));

let banners=[];
let bannerIndex=0;
let bannerTimer=null;
let bannerStartX=0;
let bannerDeltaX=0;
let bannerDragging=false;

const bannerEl=document.getElementById('banner');
const bannerTrack=document.getElementById('bannerTrack');
const bannerDots=document.getElementById('bannerDots');
const bannerViewport=document.getElementById('bannerViewport');
const grid=document.getElementById('grid');
const title=document.getElementById('title');
const simulator=document.getElementById('simulator');

function getBanners(list){
    return (Array.isArray(list)?list:[])
        .filter(b=>b && b.image_url)
        .slice()
        .sort((a,b)=>(Number(a.sort)||0)-(Number(b.sort)||0));
}

function renderBanners(list){
    banners=getBanners(list);

    if(!banners.length){
        bannerEl.style.display='none';
        stopBanner();
        return;
    }

    bannerEl.style.display='block';
    bannerEl.classList.toggle('single',banners.length===1);

    bannerTrack.innerHTML=banners.map(b=>`
        <div class="banner-slide">
            <a href="${E(b.link_url||'#')}" target="_blank" rel="noopener">
                <img src="${E(b.image_url)}" alt="Banner" loading="eager">
            </a>
        </div>
    `).join('');

    bannerDots.innerHTML=banners.map((_,i)=>`
        <button class="banner-dot${i===0?' active':''}" data-index="${i}" aria-label="第${i+1}张"></button>
    `).join('');

    bannerIndex=0;
    updateBanner(false);

    if(banners.length>1){
        startBanner();
    }else{
        stopBanner();
    }
}

function updateBanner(animate=true){
    bannerTrack.style.transition=animate?'transform .45s ease':'none';
    bannerTrack.style.transform=`translate3d(-${bannerIndex*100}%,0,0)`;

    [...bannerDots.children].forEach((dot,i)=>{
        dot.classList.toggle('active',i===bannerIndex);
    });
}

function goBanner(index,animate=true){
    if(!banners.length)return;
    bannerIndex=(index+banners.length)%banners.length;
    updateBanner(animate);
    if(banners.length>1)restartBanner();
}

function nextBanner(){
    goBanner(bannerIndex+1);
}

function prevBanner(){
    goBanner(bannerIndex-1);
}

function startBanner(){
    stopBanner();
    if(banners.length>1){
        bannerTimer=setInterval(nextBanner,3000);
    }
}

function stopBanner(){
    if(bannerTimer){
        clearInterval(bannerTimer);
        bannerTimer=null;
    }
}

function restartBanner(){
    startBanner();
}

document.getElementById('bannerNext').addEventListener('click',e=>{
    e.stopPropagation();
    nextBanner();
});
document.getElementById('bannerPrev').addEventListener('click',e=>{
    e.stopPropagation();
    prevBanner();
});

bannerDots.addEventListener('click',e=>{
    const dot=e.target.closest('.banner-dot');
    if(!dot)return;
    goBanner(Number(dot.dataset.index));
});

bannerViewport.addEventListener('pointerdown',e=>{
    if(banners.length<2)return;
    bannerDragging=true;
    bannerStartX=e.clientX;
    bannerDeltaX=0;
    bannerTrack.style.transition='none';
    try{bannerViewport.setPointerCapture(e.pointerId)}catch(_){}
    stopBanner();
});

bannerViewport.addEventListener('pointermove',e=>{
    if(!bannerDragging)return;
    bannerDeltaX=e.clientX-bannerStartX;
    const percent=(bannerDeltaX/bannerViewport.clientWidth)*100;
    bannerTrack.style.transform=`translate3d(calc(-${bannerIndex*100}% + ${percent}px),0,0)`;
});

function finishSwipe(){
    if(!bannerDragging)return;
    bannerDragging=false;
    const threshold=Math.min(80,bannerViewport.clientWidth*0.18);

    if(Math.abs(bannerDeltaX)>=threshold){
        if(bannerDeltaX<0) nextBanner();
        else prevBanner();
    }else{
        updateBanner(true);
        restartBanner();
    }
    bannerDeltaX=0;
}

bannerViewport.addEventListener('pointerup',finishSwipe);
bannerViewport.addEventListener('pointercancel',finishSwipe);
bannerViewport.addEventListener('pointerleave',e=>{
    if(bannerDragging && e.pointerType==='mouse')finishSwipe();
});

bannerViewport.addEventListener('mouseenter',()=>{
    if(banners.length>1)stopBanner();
});
bannerViewport.addEventListener('mouseleave',()=>{
    if(banners.length>1 && !bannerDragging)startBanner();
});

fetch('/api/data?_='+Date.now())
.then(r=>{
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
})
.then(d=>{
    document.title=d.settings?.title||'导航站';
    title.textContent=d.settings?.sectionTitle||'推荐导航';

    simulator.href=d.settings?.pg_simulator_url||'#';

    renderBanners(d.banners);

    const platforms=Array.isArray(d.platforms)?d.platforms:[];
    grid.innerHTML=platforms.length
        ?platforms.map(p=>`
            <article class="card">
                ${p.tag?'<span class="tag">'+E(p.tag)+'</span>':''}
                <img class="logo" src="${E(p.logo_url||'')}" alt="${E(p.name||'')}">
                <div class="name">${E(p.name)}</div>
                <div class="desc">${E(p.description||'')}</div>
                <a class="go" href="${E(p.link_url||'#')}" target="_blank" rel="noopener">进入</a>
            </article>
        `).join('')
        :'<div class="empty">暂无内容</div>';
})
.catch(e=>{
    console.error(e);
    grid.innerHTML='<div class="empty">加载失败</div>';
});
</script>
</body>
</html>
