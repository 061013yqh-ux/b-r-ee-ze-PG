<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导航站</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#17213a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:720px;margin:auto;padding:12px 10px 85px}.banner,.section{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 18px #0001;margin-bottom:14px}.banner img{display:block;width:100%;max-height:250px;object-fit:cover}.section{padding:16px}.title{font-size:22px;font-weight:800;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{position:relative;min-width:0;background:#f0f5ff;border-radius:14px;padding:10px 6px;text-align:center}.logo{width:48px;height:48px;border-radius:50%;object-fit:cover;background:white}.name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.desc{font-size:11px;color:#71809b;height:32px;line-height:16px;margin:5px 0}.go{display:inline-block;padding:7px 12px;border-radius:99px;background:#287ff0;color:#fff;text-decoration:none;font-size:12px}.tag{position:absolute;right:4px;top:4px;background:#20b95b;color:white;border-radius:4px;padding:2px 5px;font-size:9px}.empty{text-align:center;color:#8b95a8;padding:30px}.nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 20px));height:60px;background:#ffffffeF;border:1px solid #e5eaf2;border-radius:20px;display:flex;justify-content:space-around;align-items:center;box-shadow:0 6px 28px #0002}.nav a{text-decoration:none;color:#68758c;font-size:12px;text-align:center}.nav .active{color:#1976ee;font-weight:700}.ico{display:block;font-size:21px}@media(max-width:430px){.grid{gap:7px}.card{padding-left:4px;padding-right:4px}.go{padding:7px 9px}}</style></head><body><main class="wrap"><div id="banner" class="banner" style="display:none"></div><section class="section"><div class="title" id="title">推荐导航</div><div id="grid" class="grid"><div class="empty">加载中…</div></div></section></main><nav class="nav"><a id="service" href="#"><span class="ico">◉</span>客服</a><a class="active" href="/"><span class="ico">⌂</span>首页</a><a href="/admin.html"><span class="ico">⚙</span>管理</a></nav><script>const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));fetch('/api/data').then(r=>r.json()).then(d=>{document.title=d.settings.title||'导航站';title.textContent=d.settings.sectionTitle||'推荐导航';if(d.settings.service_url)service.href=d.settings.service_url;if(d.banners[0]){banner.style.display='block';banner.innerHTML='<a href="'+E(d.banners[0].link_url)+'" target="_blank" rel="noopener"><img src="'+E(d.banners[0].image_url)+'"></a>'}grid.innerHTML=d.platforms.length?d.platforms.map(p=>'<article class="card">'+(p.tag?'<span class="tag">'+E(p.tag)+'</span>':'')+'<img class="logo" src="'+E(p.logo_url||'')+'"><div class="name">'+E(p.name)+'</div><div class="desc">'+E(p.description||'')+'</div><a class="go" href="'+E(p.link_url)+'" target="_blank" rel="noopener">进入</a></article>').join(''):'<div class="empty">暂无内容</div>'}).catch(()=>grid.innerHTML='<div class="empty">加载失败</div>');</script></body></html>
